# Configuration statique coturn (TURN/STUN). Le realm et le secret partagé
# (--static-auth-secret) sont injectés en ligne de commande depuis les
# variables d'environnement TURN_REALM / TURN_SHARED_SECRET (voir
# infra/docker-compose.yml), jamais codés en dur ici.

listening-port=3478
min-port=49152
max-port=49452

# Authentification par secret partagé : des identifiants TURN éphémères et
# de courte durée sont dérivés de ce secret (RFC 5766 REST API long-term
# credentials), plutôt qu'un compte statique. Voir docs/SECURITY.md.
use-auth-secret

fingerprint
no-cli
no-tlsv1
no-tlsv1_1

# Pas de journalisation vers un fichier par défaut : sortie stdout, capturée
# par le pilote de logs Docker.
log-file=stdout
