name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # ghcr.io exige des noms d'image en minuscules ; le nom du repo GitHub
  # (shareDesk, casse mixte) n'est donc pas réutilisé tel quel.
  BACKEND_IMAGE: ghcr.io/hyugo22/sharedesk-backend
  FRONTEND_IMAGE: ghcr.io/hyugo22/sharedesk-frontend

jobs:
  backend-build:
    name: Backend — build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - working-directory: backend
        run: |
          go build ./...
          go vet ./...
          go test ./...

  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build

  agent-build:
    name: Agent — cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            cgo: "0"
            artifact: sharedesk-agent-windows-amd64.exe
          - goos: linux
            goarch: amd64
            cgo: "1"
            artifact: sharedesk-agent-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum
      - name: Install X11 dev headers (Linux CGO build only)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev
      - working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -o ../${{ matrix.artifact }} ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  agent-build-macos:
    name: Agent — build (macOS/arm64, native runner)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum
      - working-directory: agent
        run: go build -o ../sharedesk-agent-darwin-arm64 ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: sharedesk-agent-darwin-arm64
          path: sharedesk-agent-darwin-arm64
          retention-days: 30

  windows-agent-installer:
    name: Agent — Windows service + MSI installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum

      - name: Build agent binary (windows/amd64)
        working-directory: agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o ../installer/windows/sharedesk-agent.exe ./cmd/agent

      # WiX ne garantit un comportement correct que sur Windows (voir
      # installer/windows/README.md) : ce job tourne donc sur un runner
      # windows-latest plutôt que dans les conteneurs Linux du reste de la CI.
      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        working-directory: installer/windows
        run: |
          wix build ShareDeskAgent.wxs `
            -d AgentVersion=0.1.${{ github.run_number }} `
            -d AgentBinaryPath=sharedesk-agent.exe `
            -o ShareDeskAgent.msi

      - uses: actions/upload-artifact@v4
        with:
          name: ShareDeskAgent.msi
          path: installer/windows/ShareDeskAgent.msi
          retention-days: 30

  commit-agent-downloads:
    name: Commit agent binaries into the repo
    runs-on: ubuntu-latest
    needs: [agent-build, agent-build-macos, windows-agent-installer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Téléchargements ciblés par nom : sans filtre, download-artifact
      # récupère TOUS les artefacts du run, y compris les .dockerbuild
      # (attestations/cache) auto-générés par le job docker-images qui
      # tourne en parallèle dans le même run — ça a fait échouer le
      # téléchargement précédemment.
      - uses: actions/download-artifact@v4
        with: { name: sharedesk-agent-windows-amd64.exe, path: downloads }
      - uses: actions/download-artifact@v4
        with: { name: sharedesk-agent-linux-amd64, path: downloads }
      - uses: actions/download-artifact@v4
        with: { name: sharedesk-agent-darwin-arm64, path: downloads }
      - uses: actions/download-artifact@v4
        with: { name: ShareDeskAgent.msi, path: downloads }

      # Servi directement par le backend sur /downloads/ (voir
      # internal/httpapi/server.go) — pas de dépendance à un service tiers —
      # et committé dans le repo pour rester consultable/récupérable depuis
      # GitHub directement. actions/download-artifact ne préserve pas
      # toujours le bit exécutable sur les binaires Linux/macOS, d'où le
      # chmod explicite.
      - name: Update backend/static/downloads
        run: |
          chmod +x downloads/sharedesk-agent-linux-amd64 downloads/sharedesk-agent-darwin-arm64
          cp downloads/sharedesk-agent-windows-amd64.exe backend/static/downloads/
          cp downloads/sharedesk-agent-linux-amd64 backend/static/downloads/
          cp downloads/sharedesk-agent-darwin-arm64 backend/static/downloads/
          cp downloads/ShareDeskAgent.msi backend/static/downloads/

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/static/downloads
          if git diff --cached --quiet; then
            echo "Binaires inchangés, rien à committer."
            exit 0
          fi
          git commit -m "chore: update agent downloads [skip ci]"
          git push origin HEAD:main

  docker-images:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image name
        id: image
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            echo "name=${{ env.BACKEND_IMAGE }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ env.FRONTEND_IMAGE }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy (optional, SSH + docker compose)
    runs-on: ubuntu-latest
    needs: [docker-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Pull latest images and restart the stack over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}/infra
            docker compose pull
            docker compose up -d
