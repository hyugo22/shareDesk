server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les fichiers générés par Vite dans /assets sont versionnés par hash de
    # contenu (index-XXXX.js) : sûrs à mettre en cache long/immuable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html référence ces fichiers hashés : il ne doit jamais être mis
    # en cache, sous peine de charger une ancienne version de l'app tant que
    # le cache HTTP du navigateur n'expire pas (symptôme : contenu qui
    # n'apparaît qu'après un rechargement forcé).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
